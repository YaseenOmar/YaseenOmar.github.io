<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Yaseen Zaqut</title>
  
  <!-- SEO & Favicon -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #070B14;
      --bg-card: #111A2E;
      --color-primary: #3B82F6;
      --color-secondary: #22D3EE;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --grad-primary: linear-gradient(135deg, #3B82F6, #22D3EE);
      --border-color: rgba(148, 163, 184, 0.14);
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.1), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .error-container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 50px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 2;
    }

    .error-logo {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px auto;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      color: var(--bg-primary);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
    }

    .error-code {
      font-family: 'Manrope', sans-serif;
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -0.05em;
    }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      background: var(--grad-primary);
      color: var(--bg-primary);
      border: none;
    }

    .btn:hover {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
      transform: translateY(-2px);
    }

    /* Screen reader skip links styling */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-logo" aria-hidden="true">YZ</div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The screen or route you are looking for has been moved, renamed, or does not exist. Let's redirect you back safely.</p>
    <a href="index.html" class="btn">Return to Homepage</a>
  </div>

</body>
</html>
